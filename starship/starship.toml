"$schema" = 'https://starship.rs/config-schema.json'
# Prompt colors follow the active vibe — `theme` rewrites the palette line.
palette = 'techy'
add_newline = true

format = """$directory$git_branch$git_status$python$nodejs$rust$golang$cmd_duration$line_break$character"""

[directory]
style = 'bold accent'
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = ' '
style = 'accent2'
format = '[$symbol$branch]($style) '

[git_status]
style = 'muted'
format = '([$all_status$ahead_behind]($style))'

[python]
symbol = ' '
style = 'muted'
format = '[$symbol$version ]($style)'

[nodejs]
symbol = ' '
style = 'muted'
format = '[$symbol$version ]($style)'

[rust]
symbol = ' '
style = 'muted'
format = '[$symbol$version ]($style)'

[golang]
symbol = ' '
style = 'muted'
format = '[$symbol$version ]($style)'

[cmd_duration]
min_time = 2000
style = 'yellow'
format = '[ $duration]($style) '

[character]
success_symbol = '[❯](bold accent)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'

[palettes.cozy]
accent = '#cba6f7'
accent2 = '#89b4fa'
muted = '#a6adc8'
red = '#f38ba8'
green = '#a6e3a1'
yellow = '#f9e2af'

