"$schema" = 'https://starship.rs/config-schema.json'
# Prompt colors follow the active vibe — `theme` rewrites the palette line,
# and theme-palette regenerates the palette blocks at the bottom of this file.
palette = 'cozy'
add_newline = true

format = """$directory${custom.jj}$git_branch$git_status$python$nodejs$rust$golang$cmd_duration$line_break$character"""

[directory]
style = 'bold accent'
truncation_length = 3
truncate_to_repo = true

# jj repos: show change id + bookmarks instead of git's detached HEAD
[custom.jj]
command = '''jj log -r@ -n1 --no-graph --ignore-working-copy --color never -T 'change_id.shortest(8) ++ if(bookmarks, " " ++ bookmarks.join(","), "") ++ if(empty, " (empty)", "")' '''
when = 'jj root --ignore-working-copy'
shell = ['sh']
symbol = '󱗆 '
style = 'accent2'
format = '[$symbol$output]($style) '

[git_branch]
symbol = ' '
style = 'accent2'
format = '[$symbol$branch]($style) '
# jj colocated repos sit on a detached HEAD; custom.jj covers them instead
only_attached = true

[git_status]
style = 'muted'
format = '([$all_status$ahead_behind]($style))'

[python]
symbol = ' '
style = 'muted'
format = '[$symbol$version ]($style)'

[nodejs]
symbol = ' '
style = 'muted'
format = '[$symbol$version ]($style)'

[rust]
symbol = ' '
style = 'muted'
format = '[$symbol$version ]($style)'

[golang]
symbol = ' '
style = 'muted'
format = '[$symbol$version ]($style)'

[cmd_duration]
min_time = 2000
style = 'yellow'
format = '[ $duration]($style) '

[character]
success_symbol = '[❯](bold accent)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'

