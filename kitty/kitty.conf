# kitty.conf — managed in ~/dotfiles. Colors live in current-theme.conf,
# which is regenerated by `theme set <vibe>`.

# BEGIN_KITTY_THEME
include current-theme.conf
# END_KITTY_THEME

## Font
font_family      JetBrains Mono
font_size        14.0
font_features JetBrainsMono-Regular +calt +liga +dlig
font_features JetBrainsMono-Italic +calt +liga +dlig
font_features JetBrainsMono-Bold +calt +liga +dlig
font_features JetBrainsMono-BoldItalic +calt +liga +dlig

## macOS
macos_option_as_alt yes
hide_window_decorations titlebar-only
confirm_os_window_close 0

## Cozy
window_padding_width 10
background_opacity 0.96
background_blur 24
cursor_trail 1
cursor_trail_decay 0.1 0.3
scrollback_lines 10000

## Tabs
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_edge top
tab_title_template "{index} {title}"

## Layouts / splits (vim-flavored)
enabled_layouts splits:split_axis=horizontal,stack
map cmd+d       launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+enter   launch --location=split  --cwd=current
map cmd+t       new_tab_with_cwd
map cmd+shift+z toggle_layout stack

## Remote control — required for `theme` live-recolor and smart-splits
allow_remote_control socket-only
listen_on unix:/tmp/kitty
shell_integration enabled

## Seamless kitty <-> neovim pane navigation (smart-splits.nvim)
map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
# pass the keys through when neovim is focused
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

## Manage mode — zellij-style modal keymap, all home row. ctrl+o to enter.
##   h/l tabs   j/k windows   H/L reorder tabs   1-5 jump   n new tab
##   s/v splits   z zoom   x close window   , rename   r resize submode
##   esc or ctrl+o to leave
## Entering opens a zellij-style hint bar — a kitty *dock* pinned to the bottom
## edge (launch --dock-type=os-window-bottom-edge). An os-window dock is a
## tab-region dock that automatically follows the active tab, so the single bar
## window persists as you switch tabs — matching the keyboard mode, which is
## itself per-OS-window. A dock is fixed-size and excluded from the tiling layout,
## so it never consumes a window slot, and being non-focusable + --keep-focus it
## never steals focus from your work. It shows a single row of the active mode's
## keys (swapped live via mode-bar.sh signal as you enter/leave resize); the exit
## keys tear it down (matched by --var MODEBAR=1).
map --new-mode manage ctrl+o
## --spacing padding=0 makes the bar sit flush against the bottom edge: the dock
## honours the global window_padding_width (10), which otherwise leaves a 10px gap
## below the text. The leading indent comes from the spaces in mode-bar.sh itself.
map ctrl+o combine | push_keyboard_mode manage | launch --dock-type=os-window-bottom-edge --dock-size=1 --dock-focus-policy=not-focusable --keep-focus --spacing padding=0 --var=MODEBAR=1 /Users/koda/dotfiles/kitty/mode-bar.sh render
map --mode manage h previous_tab
map --mode manage l next_tab
map --mode manage j next_window
map --mode manage k previous_window
map --mode manage shift+h move_tab_backward
map --mode manage shift+l move_tab_forward
map --mode manage 1 goto_tab 1
map --mode manage 2 goto_tab 2
map --mode manage 3 goto_tab 3
map --mode manage 4 goto_tab 4
map --mode manage 5 goto_tab 5
map --mode manage n new_tab_with_cwd
map --mode manage s launch --location=hsplit --cwd=current
map --mode manage v launch --location=vsplit --cwd=current
map --mode manage z toggle_layout stack
map --mode manage x close_window
map --mode manage , set_tab_title
map --mode manage r combine | push_keyboard_mode resize | launch --type=background --allow-remote-control /Users/koda/dotfiles/kitty/mode-bar.sh signal resize
## leaving manage tears down the hint-bar dock. --allow-remote-control is required:
## it gives the background process a KITTY_LISTEN_ON=fd:N control channel so
## `kitty @ close-window` can reach this instance (a plain background process does
## not inherit the parent's socket, and fd-peers are allowed even under socket-only).
map --mode manage esc combine | pop_keyboard_mode | launch --type=background --allow-remote-control /Users/koda/dotfiles/kitty/mode-bar.sh close
map --mode manage enter combine | pop_keyboard_mode | launch --type=background --allow-remote-control /Users/koda/dotfiles/kitty/mode-bar.sh close
map --mode manage ctrl+o combine | pop_keyboard_mode | launch --type=background --allow-remote-control /Users/koda/dotfiles/kitty/mode-bar.sh close

## resize submode: the bar swaps to the resize keys while you resize; esc pops
## back to manage (swapping the bar back), where its own exit keys close it.
map --new-mode resize ctrl+shift+r
map --mode resize h resize_window narrower 2
map --mode resize j resize_window shorter 2
map --mode resize k resize_window taller 2
map --mode resize l resize_window wider 2
map --mode resize = resize_window reset
map --mode resize esc combine | pop_keyboard_mode | launch --type=background --allow-remote-control /Users/koda/dotfiles/kitty/mode-bar.sh signal manage
map --mode resize enter combine | pop_keyboard_mode | launch --type=background --allow-remote-control /Users/koda/dotfiles/kitty/mode-bar.sh signal manage

## Resize splits (works in both kitty and neovim via smart-splits)
map ctrl+alt+h resize_window narrower 2
map ctrl+alt+j resize_window shorter 2
map ctrl+alt+k resize_window taller 2
map ctrl+alt+l resize_window wider 2
map --when-focus-on var:IS_NVIM ctrl+alt+h
map --when-focus-on var:IS_NVIM ctrl+alt+j
map --when-focus-on var:IS_NVIM ctrl+alt+k
map --when-focus-on var:IS_NVIM ctrl+alt+l
