# zk — note vault config. Symlinked to ~/.config/zk by install.sh.
# Vault lives at ~/notes (ZK_NOTEBOOK_DIR, exported in zsh/rice.zsh).

[notebook]
dir = "~/notes"

[note]
language = "en"
default-title = "Untitled"
filename = "{{slug title}}"
extension = "md"
template = "note.md"

[group.journal]
paths = ["journal"]

[group.journal.note]
filename = "{{format-date now}}"
template = "daily.md"

[format.markdown]
link-format = "wiki"
hashtags = true
colon-tags = false

[tool]
editor = "nvim"
shell = "/bin/zsh"
pager = "less -FIRX"
fzf-preview = "bat -p --color always {-1}"

[lsp.diagnostics]
# surface dead links while editing; wiki-links resolve via zk
dead-link = "error"

[alias]
# `zk daily` — open (or create) today's journal entry
daily = 'zk new --no-input "$ZK_NOTEBOOK_DIR/journal"'
# `zk recent` — interactive picker over the last two weeks of edits
recent = "zk edit --interactive --sort modified- --modified-after 'last two weeks'"
