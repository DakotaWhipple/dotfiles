<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>New Tab</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <main>
    <header>
      <div id="clock">--:--</div>
      <div id="date"></div>
      <div id="vibe-row">
        <span id="vibe"></span>
        <span id="palette"></span>
      </div>
    </header>

    <div id="searchbar">
      <input id="search" type="text" autocomplete="off" spellcheck="false"
             placeholder="filter bookmarks — enter opens first hit, or searches the web">
    </div>

    <nav id="daily"></nav>
    <nav id="rediscover"></nav>
    <section id="bookmarks"></section>

    <footer>
      <span><kbd>/</kbd> filter</span>
      <span><kbd>esc</kbd> clear</span>
      <span>★ chrome's star saves — new saves surface in <b>recent</b></span>
    </footer>
  </main>

  <div id="toast" hidden></div>

  <script src="bookmarks-data.js"></script>
  <script src="newtab.js"></script>
</body>
</html>
